<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8f6" />
      <stop offset="0.6" stop-color="#fff3f4" />
      <stop offset="1" stop-color="#f7eefb" />
    </linearGradient>
    <radialGradient id="glow-pink" cx="0.18" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#f8b2bb" stop-opacity="0.55" />
      <stop offset="1" stop-color="#f8b2bb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-violet" cx="0.88" cy="0.08" r="0.5">
      <stop offset="0" stop-color="#b78af0" stop-opacity="0.4" />
      <stop offset="1" stop-color="#b78af0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6f8" />
      <stop offset="0.55" stop-color="#f8b2bb" />
      <stop offset="1" stop-color="#b78af0" />
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#2b2330" fill-opacity="0.13" />
    </pattern>
    <filter id="star-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#f8b2bb" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow-pink)" />
  <rect width="1200" height="630" fill="url(#glow-violet)" />
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.5" />

  <rect
