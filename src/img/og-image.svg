  <path d="M752 74l3.4 11.6L767 89l-11.6 3.4L752 104l-3.4-11.6L737 89l11.6-3.4z" fill="#df6e91" fill-opacity="0.8" />
  <path d="M1120 426l2.6 8.4 8.4 2.6-8.4 2.6-2.6 8.4-2.6-8.4-8.4-2.6 8.4-2.6z" fill="#8f6fe0" fill-opacity="0.8" />

